name: Deploy to Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'server.ts'
      - 'lib/colyseus/**'
      - 'Dockerfile'
      - 'fly.toml'
      - 'package.json'

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Fly.io
        uses: superfly/flyctl-actions@1.4
        with:
          args: "deploy --remote-only"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
